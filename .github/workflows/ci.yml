name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  broker-postgres:
    name: PostgreSQL broker transactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway-ci-only
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HERMES_A2A_GATEWAY_TEST_POSTGRES_DSN: postgresql://gateway:gateway-ci-only@127.0.0.1:5432/gateway_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --ignore-requires-python -e '.[dev]'
      - name: Exercise the broker with a real PostgreSQL ledger and fake A2A peer
        run: pytest --cov=hermes_a2a_gateway --cov-report=term-missing
  quality:
    env:
      # Candidate interpreters run before support metadata is widened.
      PIP_IGNORE_REQUIRES_PYTHON: "1"
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install --ignore-requires-python -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test with coverage
        run: pytest --cov=hermes_a2a_gateway --cov-report=term-missing --cov-report=xml --cov-fail-under=0
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/check_dist.py dist
          python scripts/check_wheel_install.py dist/*.whl
          python scripts/stage_compat_assets.py dist
          python scripts/write_sha256sums.py dist
          python scripts/write_sha256sums.py --check dist
